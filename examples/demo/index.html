<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skate Shop Exemplo — pagamento em USDC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ground: #f7f6f3;
        --surface: #ffffff;
        --ink: #16181d;
        --ink-soft: #5c6472;
        --ink-faint: #8b93a3;
        --rule: #e4e2dd;
        --rule-strong: #cfccc4;
        --base-blue: #0052ff;
        --ok: #0d6b46;
        --ok-soft: #e4f2ea;
        --stop: #9c2231;
        --stop-soft: #fbe8ea;
        --radius: 14px;
      }

      * { box-sizing: border-box; }

      body {
        background: var(--ground);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.55;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }

      .shell { margin: 0 auto; max-width: 620px; padding: 0 20px 80px; }

      /* ---------- topo da loja ---------- */

      .bar {
        align-items: center;
        border-bottom: 1px solid var(--rule);
        display: flex;
        gap: 12px;
        margin-bottom: 32px;
        padding: 20px 0;
      }
      .bar-logo {
        align-items: center;
        background: var(--ink);
        border-radius: 10px;
        color: #fff;
        display: flex;
        font-size: 19px;
        height: 38px;
        justify-content: center;
        width: 38px;
      }
      .bar-name { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
      .bar-net {
        background: var(--ok-soft);
        border-radius: 999px;
        color: var(--ok);
        font-size: 11.5px;
        font-weight: 600;
        margin-left: auto;
        padding: 4px 10px;
        white-space: nowrap;
      }

      h1 {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.2;
        margin: 0 0 6px;
      }
      .sub { color: var(--ink-soft); font-size: 15px; margin: 0 0 28px; }

      /* ---------- catálogo ---------- */

      .catalog { display: grid; gap: 10px; list-style: none; margin: 0 0 28px; padding: 0; }

      .card {
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: var(--radius);
        cursor: pointer;
        display: flex;
        gap: 14px;
        padding: 14px 16px;
        transition: border-color .12s, box-shadow .12s;
      }
      .card:hover { border-color: var(--rule-strong); }
      .card:has(:focus-visible) { outline: 2px solid var(--base-blue); outline-offset: 2px; }
      .card.on {
        border-color: var(--base-blue);
        box-shadow: 0 0 0 1px var(--base-blue), 0 6px 18px -12px rgba(0, 82, 255, .6);
      }

      .card input { accent-color: var(--base-blue); height: 18px; margin: 0; width: 18px; }

      .thumb {
        align-items: center;
        background: var(--ground);
        border-radius: 10px;
        display: flex;
        flex: none;
        font-size: 22px;
        height: 46px;
        justify-content: center;
        width: 46px;
      }

      .card-text { flex: 1; min-width: 0; }
      .card-name { font-size: 15px; font-weight: 500; }
      .card-desc { color: var(--ink-faint); display: block; font-size: 13px; }
      .card-price { font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 600; }

      /* ---------- total e checkout ---------- */

      .checkout {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: var(--radius);
        padding: 20px;
      }
      .line {
        display: flex;
        font-size: 14px;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .line span { color: var(--ink-soft); }
      .line.total {
        border-top: 1px solid var(--rule);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 14px 0 18px;
        padding-top: 14px;
      }
      .line.total span { color: var(--ink); font-weight: 700; }
      .line b { font-variant-numeric: tabular-nums; }

      .empty { color: var(--ink-faint); font-size: 14px; margin: 0; text-align: center; }

      /* ---------- recibo ---------- */

      .receipt { display: grid; gap: 14px; padding-top: 8px; }
      .receipt h1 { margin: 0; }
      .ref {
        color: var(--ink-faint);
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 13px;
        letter-spacing: .04em;
      }
      .verdict { border-radius: var(--radius); padding: 16px 18px; }
      .verdict.good { background: var(--ok-soft); color: var(--ok); }
      .verdict.bad { background: var(--stop-soft); color: var(--stop); }
      .verdict b { display: block; font-size: 15px; margin-bottom: 4px; }
      .verdict p { color: var(--ink-soft); font-size: 13px; margin: 0; word-break: break-all; }
      .pending { color: var(--ink-soft); font-size: 14px; margin: 0; }

      .links { display: flex; flex-wrap: wrap; gap: 18px; }
      a { color: var(--base-blue); font-size: 14px; text-underline-offset: 2px; }
      a.muted { color: var(--ink-faint); }

      /* ---------- rodapé ---------- */

      .made {
        border-top: 1px solid var(--rule);
        color: var(--ink-faint);
        font-size: 12.5px;
        margin-top: 36px;
        padding-top: 18px;
        text-align: center;
      }
      .made b { color: var(--ink-soft); font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
